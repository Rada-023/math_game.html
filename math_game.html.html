<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Farm - Game Design by KHAO</title>
    <style>
        /* Modern Farm Theme Style */
        * {
            box-sizing: border-box;
            font-family: 'Sarabun', 'Chakra Petch', cursive, sans-serif;
            user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #8bc34a;
            background-image: radial-gradient(#aed581 20%, transparent 20%);
            background-size: 20px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            width: 100%;
            background: linear-gradient(135deg, #ff9800, #f57c00);
            color: white;
            padding: 15px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            border-bottom: 5px solid #e65100;
        }

        header h1 {
            margin: 0;
            font-size: 28px;
            text-shadow: 2px 2px #bf360c;
        }

        header p {
            margin: 5px 0 0 0;
            font-size: 14px;
            opacity: 0.9;
        }

        .dashboard {
            display: flex;
            gap: 15px;
            margin: 15px 0;
            background: #fff8e1;
            padding: 10px 25px;
            border-radius: 20px;
            border: 3px solid #ffe082;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .stat-card {
            font-size: 18px;
            font-weight: bold;
            color: #5d4037;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .game-container {
            width: 90%;
            max-width: 800px;
            background: #795548;
            padding: 20px;
            border-radius: 25px;
            border: 6px solid #4e342e;
            box-shadow: 0 8px 15px rgba(0,0,0,0.3);
            text-align: center;
        }

        /* Quest / Math Question Section */
        .quest-box {
            background: #fff;
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 20px;
            border: 3px solid #ffb74d;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.05);
        }

        .quest-title {
            font-size: 20px;
            color: #e65100;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .math-problem {
            font-size: 36px;
            color: #2e7d32;
            font-weight: bold;
            margin: 10px 0;
        }

        .options-grid {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 10px;
        }

        .btn-option {
            background: #ffb74d;
            border: none;
            border-bottom: 4px solid #f57c00;
            color: #3e2723;
            font-size: 24px;
            font-weight: bold;
            padding: 10px 25px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.1s ease;
        }

        .btn-option:active {
            transform: translateY(3px);
            border-bottom: 1px solid #f57c00;
        }

        /* Farm Grid Section */
        .farm-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            background: #5d4037;
            padding: 15px;
            border-radius: 15px;
        }

        .plot {
            aspect-ratio: 1 / 1;
            background: #3e2723;
            border: 3px dashed #8d6e63;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 40px;
            cursor: pointer;
            position: relative;
            transition: transform 0.2s;
        }

        .plot:hover {
            transform: scale(1.02);
            border-color: #ffb74d;
        }

        .plot-status {
            font-size: 14px;
            color: #fff;
            margin-top: 5px;
            font-weight: bold;
        }

        /* Modal Overlay for Feedback */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .modal-content {
            background: white;
            padding: 25px;
            border-radius: 20px;
            text-align: center;
            max-width: 350px;
            width: 80%;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .modal-content h2 {
            margin-top: 0;
            font-size: 28px;
        }

        .btn-close {
            background: #4caf50;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 18px;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 15px;
        }

        .correct { color: #4caf50; }
        .incorrect { color: #f44336; }

        @media (max-width: 600px) {
            .math-problem { font-size: 28px; }
            .btn-option { font-size: 20px; padding: 8px 16px; }
            .farm-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>

    <header>
        <h1>🌾 Hay Day Math Farm 🌽</h1>
        <p>Game Design by KHAO</p>
    </header>

    <div class="dashboard">
        <div class="stat-card">🪙 เหรียญ: <span id="coins">0</span></div>
        <div class="stat-card">⭐ คะแนน: <span id="score">0</span></div>
        <div class="stat-card">💧 น้ำ: <span id="water">3</span></div>
    </div>

    <div class="game-container">
        <!-- Math Question Box -->
        <div class="quest-box">
            <div class="quest-title">🚜 แก้น้องโจทย์คณิตเพื่อปลูกและเก็บเกี่ยวพืช!</div>
            <div class="math-problem" id="question">1 + 1 = ?</div>
            <div class="options-grid" id="options">
                <!-- Answer Buttons dynamically added here -->
            </div>
        </div>

        <!-- Farm Grid -->
        <div class="farm-grid" id="farm">
            <!-- 6 Plots created via JS -->
        </div>
    </div>

    <!-- Notification Modal -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <h2 id="modal-title">แจ้งเตือน</h2>
            <p id="modal-msg" style="font-size: 18px;"></p>
            <button class="btn-close" onclick="closeModal()">ตกลง</button>
        </div>
    </div>

    <script>
        // Game State Variables
        let coins = 0;
        let score = 0;
        let water = 3;
        let currentAnswer = 0;
        let selectedPlotIndex = null;

        // Crop Types
        const crops = [
            { name: 'แครอท 🥕', icon: '🥕', growTime: 0 },
            { name: 'ข้าวโพด 🌽', icon: '🌽', growTime: 0 },
            { name: 'มะเขือเทศ 🍅', icon: '🍅', growTime: 0 }
        ];

        // Plots State (6 plots)
        // status: 'empty', 'growing', 'ready'
        let plots = Array(6).fill(null).map(() => ({ status: 'empty', crop: null }));

        // Initialize Game
        window.onload = function() {
            renderFarm();
            generateQuestion();
        };

        // Generate Math Question suitable for Grade 1 - 2
        function generateQuestion() {
            const isAddition = Math.random() > 0.5;
            let num1, num2;

            if (isAddition) {
                // Addition: sum <= 20
                num1 = Math.floor(Math.random() * 10) + 1;
                num2 = Math.floor(Math.random() * 10) + 1;
                currentAnswer = num1 + num2;
                document.getElementById('question').innerText = `${num1} + ${num2} = ?`;
            } else {
                // Subtraction: no negative numbers
                num1 = Math.floor(Math.random() * 15) + 5;
                num2 = Math.floor(Math.random() * num1) + 1;
                currentAnswer = num1 - num2;
                document.getElementById('question').innerText = `${num1} - ${num2} = ?`;
            }

            // Generate 3 choices
            let choices = [currentAnswer];
            while (choices.length < 3) {
                let wrongChoice = currentAnswer + (Math.floor(Math.random() * 5) - 2);
                if (wrongChoice >= 0 && !choices.includes(wrongChoice)) {
                    choices.push(wrongChoice);
                }
            }

            // Shuffle Choices
            choices.sort(() => Math.random() - 0.5);

            // Render Choice Buttons
            const optionsContainer = document.getElementById('options');
            optionsContainer.innerHTML = '';
            choices.forEach(choice => {
                const btn = document.createElement('button');
                btn.className = 'btn-option';
                btn.innerText = choice;
                btn.onclick = () => checkAnswer(choice);
                optionsContainer.appendChild(btn);
            });
        }

        // Render Farm Plots
        function renderFarm() {
            const farmContainer = document.getElementById('farm');
            farmContainer.innerHTML = '';

            plots.forEach((plot, index) => {
                const plotEl = document.createElement('div');
                plotEl.className = 'plot';
                plotEl.onclick = () => interactPlot(index);

                if (plot.status === 'empty') {
                    plotEl.innerHTML = `🟫<div class="plot-status">แปลงว่าง</div>`;
                } else if (plot.status === 'growing') {
                    plotEl.innerHTML = `🌱<div class="plot-status">กำลังโต (รอน้ำ)</div>`;
                } else if (plot.status === 'ready') {
                    plotEl.innerHTML = `${plot.crop.icon}<div class="plot-status">พร้อมเก็บเกี่ยว!</div>`;
                }

                farmContainer.appendChild(plotEl);
            });

            // Update UI Stats
            document.getElementById('coins').innerText = coins;
            document.getElementById('score').innerText = score;
            document.getElementById('water').innerText = water;
        }

        // Check Math Answer
        function checkAnswer(selectedChoice) {
            if (selectedChoice === currentAnswer) {
                // Correct Answer
                coins += 10;
                score += 5;
                water += 1;
                
                // Find an empty plot or growing plot to advance
                let emptyIndex = plots.findIndex(p => p.status === 'empty');
                let growingIndex = plots.findIndex(p => p.status === 'growing');

                if (emptyIndex !== -1) {
                    // Plant a new crop
                    const randomCrop = crops[Math.floor(Math.random() * crops.length)];
                    plots[emptyIndex] = { status: 'growing', crop: randomCrop };
                    showModal('ถูกต้อง! 🎉', `<span class="correct">เก่งมาก!</span> ได้รับ 🪙+10, 💧+1 และปลูกผักในแปลงที่ ${emptyIndex + 1}`);
                } else if (growingIndex !== -1) {
                    // Water the growing crop to make it ready
                    plots[growingIndex].status = 'ready';
                    showModal('ถูกต้อง! 🎉', `<span class="correct">เก่งมาก!</span> พืชในแปลงที่ ${growingIndex + 1} โตเต็มที่พร้อมเก็บเกี่ยวแล้ว!`);
                } else {
                    showModal('ถูกต้อง! 🎉', `<span class="correct">เก่งมาก!</span> ได้รับ 🪙+10 และ 💧+1 (ฟาร์มของคุณเต็มแล้ว เก็บเกี่ยวเลย!)`);
                }

                generateQuestion();
                renderFarm();
            } else {
                // Wrong Answer
                showModal('ยังไม่ถูกนะ 🤔', '<span class="incorrect">พยายามอีกครั้งนะเด็กๆ!</span> ลองคิดคำนวณใหม่อีกทีครับ');
            }
        }

        // Interact with Farm Plots
        function interactPlot(index) {
            const plot = plots[index];

            if (plot.status === 'ready') {
                // Harvest
                coins += 20;
                score += 10;
                showModal('เก็บเกี่ยวสำเร็จ! 🧺', `คุณได้รับ ${plot.crop.name} และขายได้ 🪙+20 เหรียญ!`);
                plots[index] = { status: 'empty', crop: null };
                renderFarm();
            } else if (plot.status === 'growing' && water > 0) {
                // Water Crop
                water -= 1;
                plots[index].status = 'ready';
                showModal('รดน้ำผัก 💦', `ผักเจริญเติบโตเต็มที่แล้ว! พร้อมเก็บเกี่ยว`);
                renderFarm();
            } else if (plot.status === 'empty') {
                showModal('แปลงผักว่างเปล่า 🚜', 'ตอบคำถามคณิตศาสตร์ด้านบนเพื่อเริ่มปลูกผักนะจ๊ะ');
            } else if (plot.status === 'growing' && water <= 0) {
                showModal('น้ำหมดแล้ว! 💧', 'ตอบคำถามคณิตศาสตร์ให้ถูกต้องเพื่อรับน้ำเพิ่ม');
            }
        }

        // Modal Helpers
        function showModal(title, msg) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-msg').innerHTML = msg;
            document.getElementById('modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
        }
    </script>
</body>
</html>
